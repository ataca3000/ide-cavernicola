name: IDC Cognitive CI & Reality Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  reality-verification:
    name: Reality Verification (IDC Test & Cognitive Cycle)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Complete Unit Test Suite (Pytest)
        run: |
          pytest tests/

      - name: 5. Execute Prototype 0001 (Cognitive Loop Validation)
        run: |
          python experiments/prototype_0001/main.py

      - name: 6. Run DevOps Autonomous Agent Simulation
        run: |
          python examples/devops_autonomous_agent/agent.py
