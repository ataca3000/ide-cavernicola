name: IDC Cognitive CI & Reality Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  reality-verification:
    name: Reality Verification (IDC Test & Cognitive Cycle)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Install ast-grep (sg)
        uses: taiki-e/install-action@v2
        with:
          tool: ast-grep

      - name: 5. Run Complete Unit Test Suite (Pytest)
        run: |
          pytest tests/

      - name: 6. Execute Prototype 0001 (Cognitive Loop Validation)
        run: |
          python experiments/prototype_0001/main.py

      - name: 7. Run DevOps Autonomous Agent Simulation
        run: |
          python examples/devops_autonomous_agent/agent.py

      - name: 8. Execute Cognitive Ingest (SQLite Episodic Memory)
        run: |
          python scripts/idc_ingest.py

      - name: 9. Compute Architectural Telemetry & Causal Metrics
        run: |
          python scripts/idc_queries.py

      - name: 10. Capture CI Failures into Causal Trash
        if: failure()
        run: |
          python scripts/store_failure.py --goal "ci_pipeline_verification" --action "github_actions_run" --error "CI Step Failed"

      - name: 11. Upload IDC Episodic SQLite Database
        uses: actions/upload-artifact@v4
        with:
          name: idc-sqlite-memory
          path: memory/idc.db

